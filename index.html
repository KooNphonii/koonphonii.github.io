<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koo Nphonii | Indie Game Developer</title>

    <link rel="icon" href="./favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: #f9f9f9;
            color: #1e1e1e;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.02);
            padding: 2.5rem 2rem;
            text-align: center;
            transition: all 0.2s ease;
        }

        h1 {
            font-family: 'Barlow', system-ui, sans-serif;
            font-weight: 900;
            font-size: 3rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 0.35rem;
            color: #0a0a0a;
        }

        .subhead {
            font-weight: 500;
            font-size: 1.15rem;
            color: #4b5563;
            margin-bottom: 2.25rem;
            border-bottom: 1px solid #e9eef2;
            padding-bottom: 1.25rem;
        }

        .section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-family: 'Barlow', system-ui, sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #374151;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .section-title::before,
        .section-title::after {
            content: "";
            flex: 0.2;
            height: 1px;
            background: linear-gradient(to right, transparent, #cbd5e1, transparent);
        }

        .games-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
        }

        .game-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            padding: 0;
            width: 315px;
            max-width: 100%;
            flex: 0 1 auto;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            overflow: hidden;
        }

        .game-card:hover {
            border-color: #94a3b8;
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.1);
            background: #ffffff;
        }

        .game-thumb {
            width: 315px;
            max-width: 100%;
            height: 250px;
            object-fit: cover;
            background: #e2e8f0;
            display: block;
            border-radius: 1.5rem 1.5rem 0 0;
        }

        .game-name {
            font-weight: 700;
            font-size: 1.25rem;
            color: #0f172a;
            letter-spacing: 0.01em;
            margin-top: 0.75rem;
            padding: 0 1rem;
        }

        .game-platform {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            padding: 0 1rem 1rem;
        }

        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #1f2937;
            text-decoration: none;
            border: 1px solid transparent;
            transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
        }

        .social-link:hover {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #0066cc;
            transform: translateY(-2px);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            display: block;
        }

        .privacy-link {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }

        .privacy-link a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            transition: background 0.15s;
        }

        .privacy-link a:hover {
            background: #eef2f6;
            text-decoration: none;
        }

        @media (max-width: 550px) {
            .container {
                padding: 2rem 1.25rem;
            }

            h1 {
                font-size: 2.1rem;
            }

            .subhead {
                font-size: 1rem;
                margin-bottom: 1.75rem;
            }

            .game-card {
                width: 100%;
                max-width: 315px;
            }

            .game-thumb {
                width: 100%;
                height: auto;
                aspect-ratio: 315 / 250;
            }

            .social-link {
                width: 44px;
                height: 44px;
            }

            .social-link svg {
                width: 18px;
                height: 18px;
            }

            .section-title {
                font-size: 1rem;
            }

            .section-title::before,
            .section-title::after {
                flex: 0.1;
            }
        }
    </style>
</head>
<body>
